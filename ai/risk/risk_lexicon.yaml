# 한국어 위험 표현 사전 (TRD 16-3). 초안이다. 범주별 최소 level과 표현은
# 임상 자문을 받아 확정한다 (부록 H-14).
# AI 서버(Python)와 백엔드 RiskRuleEngine(Java)이 같은 파일을 쓴다. 두 엔진은
# risk/rule_cases.jsonl의 결과가 전부 같아야 한다.
#
# 판정 규칙:
#  1. 입력을 정규화한다 (ai/app/text.py와 같은 순서):
#     NFC → 전각 ASCII(U+FF01~FF5E)를 반각으로 → 공백류(U+00A0, U+1680, U+2000~200A,
#     U+202F, U+205F, U+3000)를 보통 공백으로 → 제로폭(U+200B~200D, U+2060, U+FEFF) 삭제.
#  2. 패턴은 Python re / Java regex 공통 문법만 쓴다. \s \d \S 는 ASCII 기준이다
#     (Python은 re.ASCII, Java는 기본값). 대소문자를 구분한다.
#     수량자에는 상한을 둔다 (\s{0,3}, \S{1,20}). \s* \S+ 처럼 상한 없는 수량자는
#     긴 입력에서 서버를 멈출 수 있으므로 쓰지 않는다.
#  3. 범주마다 패턴을 찾는다. 일치하면 그 범주의 min_level이 후보가 된다.
#  4. 부정·인용 표현(dampeners)이 일치 구간과 같은 문장 안에서
#     뒤쪽 after_window자 또는 앞쪽 before_window자 안에 있으면 level을 한 단계 낮춘다.
#     글자 수는 유니코드 코드 포인트로 센다 (Java는 codePoint 단위로 자른다. 이모지는 1자).
#     문장은 . ! ? … 와 줄바꿈으로 끊는다. low 아래로는 낮추지 않는다 (없어지지 않는다).
#  5. 최종 level은 모든 일치의 최댓값이고, 일치가 없으면 none이다.
#  6. rule_hits는 일치한 범주 id를 이 파일의 순서대로 중복 없이 나열한다.
version: 1
levels: [none, low, medium, high, critical]
categories:
  - id: imminent_suicide
    label: 계획·수단
    min_level: critical
    patterns:
      - '유서'
      - '번개탄'
      - '연탄을\s{0,3}(?:피우|사)'
      - '농약'
      - '목을\s{0,3}매'
      - '뛰어\s{0,3}내리'
      - '투신'
      - '(?:수면제|약)(?:을|를)?\s{0,3}(?:\S{1,20}\s{1,3}){0,2}(?:한꺼번에|잔뜩|모아|모으)'
      - '죽을\s{0,3}(?:날|방법|준비|계획|장소)'
      - '자살\s{0,3}(?:계획|방법|준비|시도)'
      - '옥상에\s{0,3}(?:올라|서\s{0,3}있)'
      - '(?:한강|마포대교|다리)\s{0,3}(?:난간|위에\s{0,3}서)'
      - '마지막\s{0,3}(?:인사|정리)를'
  - id: suicidal_ideation
    label: 자살 사고
    min_level: high
    patterns:
      - '죽고\s{0,3}싶'
      - '자살'
      - '죽어\s{0,3}버리'
      - '죽었으면'
      - '죽는\s{0,3}게\s{0,3}(?:낫|나을|편)'
      - '사라지고\s{0,3}싶'
      - '없어지고\s{0,3}싶'
      - '살고\s{0,3}싶지\s{0,3}않'
      - '살기\s{0,3}싫'
      - '그만\s{0,3}살고'
      - '삶을\s{0,3}끝내'
      - '(?<![을를] )다\s{0,3}끝내고\s{0,3}싶'
      - '세상을\s{0,3}떠나'
      - '(?:내가|제가)\s{0,3}없(?:어지면|으면|는\s{0,3}게)'
      - '세상에\s{0,3}없는\s{0,3}게'
      - '영원히\s{0,3}잠들고\s{0,3}싶'
      - '(?:안\s{0,3}깼으면|깨지\s{0,3}않았으면|깨어나지\s{0,3}않았으면)'
      - '눈을?\s{0,3}뜨고\s{0,3}싶지\s{0,3}않'
      - '극단적(?:인)?\s{0,3}(?:선택|생각)'
  - id: self_harm
    label: 자해
    min_level: high
    patterns:
      - '자해'
      - '손목을\s{0,3}(?:긋|그었|그어)'
      - '칼로\s{0,3}(?:\S{1,20}\s{1,3})?(?:긋|그었|그어)'
      - '몸에\s{0,3}상처를\s{0,3}(?:내|냈)'
      - '스스로(?:를)?\s{0,3}(?:때리|해치|다치게)'
      - '머리를\s{0,3}(?:박|찧)'
  - id: harm_to_others
    label: 타해
    min_level: high
    patterns:
      - '죽이고\s{0,3}싶'
      - '죽여\s{0,3}버리'
      - '죽일\s{0,3}(?:거|것|생각)'
      - '찌르고\s{0,3}싶'
      - '해치고\s{0,3}싶'
      - '가만\s{0,3}(?:안\s{0,3}둘|두지\s{0,3}않)'
  - id: abuse_victim
    label: 학대·폭력 피해
    min_level: medium
    patterns:
      - '(?:에게|한테)\s{0,3}(?:맞았|맞고|맞아)'
      - '(?:저를|나를|절|날)\s{0,3}(?:때려|때리|때렸)'
      - '폭행'
      - '학대'
      - '성폭력|성폭행|성추행'
      - '가정\s{0,3}폭력'
      - '데이트\s{0,3}폭력'
      - '스토킹'
      - '협박'
      - '감금'
dampeners:
  after_window: 14
  before_window: 10
  after:
    - '정도는\s{0,3}아니'
    - '정도까지는\s{0,3}아니'
    - '(?:은|다는)\s{0,3}건\s{0,3}아니'
    - '지는?\s{0,3}않(?!으면)'
    - '진\s{0,3}않'
    - '생각은\s{0,3}없'
    - '마음은\s{0,3}없'
    - '다고\s{0,3}(?:하더라|하던데|그러더라|그러던데)'
    - '다는\s{0,3}(?:뉴스|기사|노래|가사|영화|드라마|대사)'
    - '(?:이라는|라는)\s{0,3}(?:뉴스|기사|노래|가사|영화|드라마|대사|단어)'
  before:
    - '농담'
    - '장난으로'
    - '(?:뉴스|기사|영화|드라마)에서'
