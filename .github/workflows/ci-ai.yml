name: AI Server CI

# TRD 7-4, 18-5: PR → develop·main, 경로 ai/**
on:
  pull_request:
    branches: [develop, main]
    # labeled·unlabeled: ai-breaking 라벨을 붙이거나 떼면 다시 검사한다 (5번 단계)
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "ai/**"

concurrency:
  group: ci-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai

    env:
      # 테스트 전용 값. 실 LLM 키는 쓰지 않는다 (fake LLM).
      LLM_PROVIDER: fake
      AI_INTERNAL_TOKENS: ci-only-internal-token-0123456789abcdef

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: uv 설치
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock

      # 1. uv sync --frozen → ruff check → ruff format --check (실패 시 머지 차단)
      - name: 의존성 설치
        run: uv sync --frozen

      - name: Ruff 검사
        run: uv run ruff check .

      - name: Ruff 포맷 검사
        run: uv run ruff format --check .

      # 2. mypy app/functions app/llm (간지톤 기간 경고만)
      - name: mypy
        continue-on-error: true
        run: uv run mypy app/functions app/llm

      # 3. pytest — fake LLM, 엔드포인트 7개, 계약 예시 검증, 규칙·패턴 공통 사례, 본문 로그 금지 검사
      - name: pytest
        run: uv run pytest -q

      # 4. 생성한 내부 계약이 커밋본과 다르면 실패
      - name: openapi.json 최신 여부
        run: |
          uv run python -m app.export_openapi > /tmp/ai-openapi.json
          diff -q /tmp/ai-openapi.json openapi.json || {
            echo "::error::ai/openapi.json이 코드와 다릅니다. 'make ai-openapi' 후 커밋하세요."
            exit 1
          }

      # 5. 기준 브랜치의 ai/openapi.json과 깨지는 변경 비교 — ai-breaking 라벨이 없으면 실패
      - name: 깨지는 내부 계약 변경 검사 (oasdiff)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ai-breaking') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git show FETCH_HEAD:ai/openapi.json > /tmp/base-openapi.json 2>/dev/null; then
            echo "기준 브랜치에 ai/openapi.json이 아직 없어 건너뜁니다."
            exit 0
          fi
          docker run --rm -v /tmp:/specs:ro tufin/oasdiff breaking \
            /specs/base-openapi.json /specs/ai-openapi.json --fail-on ERR
