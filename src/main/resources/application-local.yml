# 각자 PC에서 개발할 때 (docker compose up -d 로 DB·Redis 먼저 띄우기)
# 다른 프로젝트(8080)랑 동시에 띄워도 안 겹치게 로컬은 8090

server:
  port: ${SERVER_PORT:8090}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mindcare}
    username: ${DB_USERNAME:mindcare}
    password: ${DB_PASSWORD:mindcare}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6380}

app:
  crypto:
    # 로컬·CI 전용 공개 키 (CI ci.yml과 같은 값). staging·prod는 환경변수로 진짜 키를 넣는다
    encryption-key: ${APP_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    hmac-key: ${APP_HMAC_KEY:bWluZGNhcmUtbG9jYWwtaG1hYy1rZXktMzJieXRlcyE=}

logging:
  level:
    com.mindcare: debug
